server {
	listen       80;
	server_name  _;
	root         /usr/share/nginx/html;

	gzip              on;
	gzip_vary         on;
	gzip_min_length   1024;
	gzip_proxied      any;
	gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

	# Vite fingerprints every asset it emits, so the file name changes whenever the content
	# does and these can be cached indefinitely. `=404` is deliberate: a mistyped asset URL
	# must fail, not fall through to the SPA and return HTML with a .js content type.
	location /assets/ {
		add_header Cache-Control "public, immutable, max-age=31536000";
		try_files  $uri =404;
	}

	# The SPA's routes are client-side (TanStack Router), so a deep link like /place/123 has
	# no file behind it and must still return index.html.
	#
	# The no-store belongs here rather than on `location = /index.html`, because that exact
	# path is what almost nobody requests — `/` and every deep link are served by this block
	# and never enter that one. index.html names the current hashed bundles, so caching it
	# is precisely how a deploy fails to reach anyone.
	location / {
		add_header Cache-Control "no-store";
		try_files  $uri $uri/ /index.html;
	}
}
