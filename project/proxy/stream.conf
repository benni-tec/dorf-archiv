# Postgres, proxied at the TCP level.
#
# **There is no hostname here, and there cannot be.** The plan for the proxy was
# `db.<host>` alongside the HTTP names, but the Postgres wire protocol carries nothing like
# a Host header, so a TCP proxy has nothing to route on. nginx can route a stream by name
# only via TLS SNI, and a Postgres client does not send one: it opens in plaintext and asks
# to upgrade with an `SSLRequest` message, so there is no ClientHello for `ssl_preread` to
# look at. (Postgres 17's `sslnegotiation=direct` does start with a real TLS handshake, but
# relying on it would mean requiring that option, a server certificate, and a client new
# enough to offer it.)
#
# So the database gets its own port instead, and the name in the connection string is
# whatever resolves to this host. It is published on a different port from the one
# compose.infra.yml already binds, because both would otherwise claim 5432 on the same
# address and the proxy would fail to start.
server {
	listen     5432;
	proxy_pass postgres:5432;

	# A psql session or a migration can sit idle far longer than a request does.
	proxy_timeout 1h;
	proxy_connect_timeout 5s;
}
