# Top-level nginx configuration for the reverse proxy.
#
# The stock file only includes `conf.d` inside `http {}`, and routing Postgres needs a
# `stream {}` block, which is a top-level context — hence a replacement rather than an
# addition. `--with-stream` is compiled into the official image, so nothing needs loading.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" '
	                  '"$http_user_agent" "$http_x_forwarded_for" host=$host';

	access_log  /var/log/nginx/access.log  main;

	sendfile        on;
	keepalive_timeout  65;

	# Uploads are photographs of prints, straight off a phone. The default 1m rejects them
	# with a 413 that looks like a bug rather than a limit.
	client_max_body_size 64m;

	# Rendered from templates/ by the image's entrypoint, so ${PROXY_HOST} is substituted.
	include /etc/nginx/conf.d/*.conf;
}

stream {
	include /etc/nginx/stream.d/*.conf;
}
