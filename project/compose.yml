# The whole stack on one box — PLAN.md §4.1 shape 2, a legitimate deployment rather than a
# development convenience. Brought up by `bun run compose:up`.
#
# **Nothing but the proxy is published.** Postgres, MinIO and pgAdmin are reachable only over
# the Compose network; the proxy is the single way in, and the database has no route through
# it at all. `compose.dev.yml` is the file that publishes ports, because development needs
# them — the server and the migrations run from the host there.
#
# That is why the two files are written out separately rather than one including the other:
# an including file can add a published port but cannot take one away, and the difference
# between these two stacks is precisely which ports exist. The cost is that the backing
# services are defined twice, so a change to one usually belongs in both.
#
# Volumes are named and survive teardown — `down`, never `down -v`.

name: dorf-archiv

services:
  postgres:
    build:
      context: postgres
    image: dorf-archiv/postgres:18-hunspell
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dorf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorf}
      POSTGRES_DB: ${POSTGRES_DB:-dorf_archiv}
    # No ports. The application reaches the database by service name, and a human reaches it
    # through pgAdmin on db.<host>. Publishing it here would put the archive's whole contents
    # one password guess from the internet.
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/<major>/docker, so the volume belongs
      # one level up. Mounting .../data here would leave the database in the container's
      # writable layer and lose it on recreate.
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dorf}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret}
    # Unpublished for the same reason as the database — the bucket holds unmoderated uploads
    # from the moment they are made (PLAN.md §4.6 #3).
    #
    # This needs revisiting when uploads land: presigned URLs are handed to browsers, so the
    # S3 endpoint has to be reachable by them, which means a public route of some kind.
    volumes:
      - minio-data:/data

  # One-shot bucket creation, so a first run never means clicking through the MinIO console.
  # It retries rather than depending on a healthcheck, because the MinIO image carries no
  # reliable in-container probe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_BUCKET: ${S3_BUCKET:-dorf-archiv}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dorf}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
            break
          fi
          echo "waiting for minio ($$attempt/30)"
          sleep 2
        done
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # PLAN.md §4.6 #3: unpublished blobs sit in storage from the moment of upload, so a
        # public bucket policy would bypass moderation entirely. Files reach browsers only
        # through short-lived presigned URLs the backend issues after a permission check.
        mc anonymous set none "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready (private)"

  # The database's only face on the web, since the database itself has no route in. Reached
  # at db.<host> through the proxy.
  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dorf-archiv.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dorf-dev-secret}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # `.test` is the TLD reserved for exactly this, so the default login can never be a
      # real address — but pgAdmin rejects reserved TLDs until they are allowed explicitly.
      # The value is a Python list literal, which is what pgAdmin parses this into.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test', 'local', 'localhost', 'invalid']"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      # Behind the reverse proxy, pgAdmin must build its redirects from the forwarded headers
      # rather than from the container's own name, or the login loops. Each count is the
      # number of proxies adding that header — one. These are set *only* here: trusting a
      # forwarded header when nothing in front is setting it lets a client spoof it, which is
      # why compose.dev.yml leaves them out.
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./postgres/servers.json:/pgadmin4/servers.json:ro

  app:
    build:
      context: ..
      dockerfile: project/server/Dockerfile
    image: dorf-archiv/app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-dorf}:${POSTGRES_PASSWORD:-dorf}@postgres:5432/${POSTGRES_DB:-dorf_archiv}
      # The bundled Postgres image carries the Hunspell dictionary, so this deployment gets
      # full-quality German search. On a host without it, drop this and search degrades to
      # stemming only (PLAN.md §4.3).
      TEXT_SEARCH_CONFIG: ${TEXT_SEARCH_CONFIG:-german_hunspell}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-dorf-archiv}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dorf}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret}
      S3_FORCE_PATH_STYLE: "true"

  client:
    build:
      context: ..
      dockerfile: project/client/Dockerfile
      args:
        # Baked into the bundle at build time, not read at run time — Vite substitutes
        # `import.meta.env` during the build. Pointing the stack at a real hostname means
        # rebuilding this image, which is why it is a build argument rather than an
        # environment variable that would silently do nothing.
        #
        # Deliberately **not** ${VITE_SERVER_URL}: that variable is development's, where the
        # client runs on the host and talks to :3000 directly. In this stack the client is
        # reached through the proxy and so is the API, so the URL follows the proxy's names.
        # CLIENT_API_URL overrides it for a deployment whose API lives somewhere else.
        VITE_SERVER_URL: ${CLIENT_API_URL:-http://${PROXY_API_HOST:-api.${PROXY_HOST:-localhost}}:${PROXY_PORT:-8000}}
    image: dorf-archiv/client:latest
    restart: unless-stopped
    depends_on:
      - app

  # The single entry point, routing by hostname (PLAN.md §4.1 shape 2):
  #
  #   http://${PROXY_HOST}:${PROXY_PORT}       the client
  #   http://api.${PROXY_HOST}:${PROXY_PORT}   the API
  #   http://db.${PROXY_HOST}:${PROXY_PORT}    pgAdmin
  #
  # Each name can be overridden on its own with PROXY_CLIENT_HOST, PROXY_API_HOST or
  # PROXY_DB_HOST.
  proxy:
    build:
      # This directory, not the repository root: the proxy needs only its Dockerfile and
      # nginx.conf, and project/.dockerignore keeps the rest of the workspace out.
      context: .
      dockerfile: Dockerfile
    image: dorf-archiv/proxy:latest
    restart: unless-stopped
    # No depends_on: every upstream is resolved per request rather than at start-up, so the
    # proxy comes up whether or not the services behind it exist yet, and stays up while one
    # of them restarts. Routes to a missing service answer 502.
    environment:
      # Each name is assembled here, from PROXY_HOST, the same way DATABASE_URL is assembled
      # from its parts — the proxy receives finished hostnames rather than a base name and
      # the rules for building the others. That keeps the composition in one readable place,
      # and it means a deployment can put any one of them on an unrelated domain by setting
      # its own variable, without the others following it.
      PROXY_CLIENT_HOST: ${PROXY_CLIENT_HOST:-${PROXY_HOST:-localhost}}
      PROXY_API_HOST: ${PROXY_API_HOST:-api.${PROXY_HOST:-localhost}}
      PROXY_DB_HOST: ${PROXY_DB_HOST:-db.${PROXY_HOST:-localhost}}
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_PORT:-8000}:80"

volumes:
  postgres-data:
  minio-data:
  pgadmin-data:
