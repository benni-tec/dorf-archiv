# The reverse proxy's entire configuration — main context, HTTP vhosts and the TCP stream in
# one file (paired with ./Dockerfile).
#
# It is one file rather than several because the pieces cannot be separated cleanly anyway:
# a `stream {}` block is a top-level context, so it cannot live in `conf.d` the way the
# stock image's includes do, which means this file has to replace `nginx.conf` outright
# rather than add to it.
#
# It is rendered at container start by the nginx image's envsubst entrypoint, with
# NGINX_ENVSUBST_OUTPUT_DIR pointing at /etc/nginx — which is why the hostnames survive into
# here as ${PROXY_*} placeholders. NGINX_ENVSUBST_FILTER limits substitution to those names,
# so nginx's own $host, $http_upgrade and $proxy_add_x_forwarded_for are left alone; without
# that filter envsubst would replace them with nothing.
#
# Each hostname arrives whole. This file does not know that the API is "api." prefixed onto
# a base host — compose assembles the names out of PROXY_HOST, the way it assembles
# DATABASE_URL out of its parts — so moving one of them to an unrelated domain needs no
# change here.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" '
	                  '"$http_user_agent" "$http_x_forwarded_for" host=$host';

	access_log  /var/log/nginx/access.log  main;

	sendfile           on;
	keepalive_timeout  65;

	# Uploads are photographs of prints, straight off a phone. The default 1m rejects them
	# with a 413 that reads like a bug rather than a limit.
	client_max_body_size 64m;

	# Docker's embedded DNS. Naming a resolver is what lets the upstreams below be
	# written as variables, and *that* is what defers their lookup to request time.
	#
	# It matters because this proxy lives in the infrastructure stack while `app` and
	# `client` are in the application one: with a literal `proxy_pass http://app:3000`
	# nginx resolves every upstream at start-up and refuses to run when one is missing, so
	# `dev:infra` alone would not start the proxy at all. Written this way, the routes to
	# absent services answer 502 and everything else works — which is also what keeps the
	# proxy up while the API container restarts.
	resolver 127.0.0.11 valid=10s ipv6=off;

	# Passes a websocket upgrade through when there is one, and closes cleanly when there
	# is not. pgAdmin's query tool and dashboards need it.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Set once here and inherited by every location below, which is the only reason this
	# merge works: nginx replaces *all* inherited directives of a given name as soon as a
	# lower level sets one, so a location adding its own `proxy_set_header` would silently
	# drop every header set above it. Nothing below sets one.
	proxy_http_version 1.1;
	proxy_set_header   Host              $host;
	proxy_set_header   X-Real-IP         $remote_addr;
	proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header   X-Forwarded-Proto $scheme;
	proxy_set_header   X-Forwarded-Host  $http_host;
	proxy_set_header   Upgrade           $http_upgrade;
	proxy_set_header   Connection        $connection_upgrade;

	# Anything arriving under a name we do not serve. This has to stay first: without a
	# default server the first block below becomes one, and a stray Host header would
	# silently reach the client app.
	server {
		listen      80 default_server;
		server_name _;
		return      404;
	}

	# The archive itself, on the bare host.
	server {
		listen      80;
		server_name ${PROXY_CLIENT_HOST};

		location / {
			set        $upstream_client client:80;
			proxy_pass http://$upstream_client;
		}
	}

	# The API.
	server {
		listen      80;
		server_name ${PROXY_API_HOST};

		location / {
			set        $upstream_api app:3000;
			proxy_pass http://$upstream_api;
		}
	}

	# pgAdmin. It builds absolute URLs for its redirects, so it needs the forwarded headers
	# above *and* the matching PGADMIN_CONFIG_PROXY_X_* counts in compose.infra.yml — with
	# only one of the two it redirects to the container's own name and the login loops.
	server {
		listen      80;
		server_name ${PROXY_ADMIN_HOST};

		# Long-lived websockets, and only here: a global read timeout this generous would
		# let any hung upstream tie up a worker for an hour.
		proxy_read_timeout 3600s;

		location / {
			set        $upstream_admin pgadmin:80;
			proxy_pass http://$upstream_admin;
		}
	}
}

# Postgres, proxied at the TCP level.
#
# **There is no hostname here, and there cannot be.** `db.<host>` alongside the HTTP names
# is not buildable: the Postgres wire protocol carries nothing like a Host header, so a TCP
# proxy has nothing to route on. nginx can route a stream by name only via TLS SNI, and a
# Postgres client does not send one — it opens in plaintext and asks to upgrade with an
# `SSLRequest` message, so there is no ClientHello for `ssl_preread` to look at. (Postgres
# 17's `sslnegotiation=direct` does start with a real handshake, but relying on it would
# mean requiring that option, a server certificate, and a client new enough to offer it.)
#
# So the database gets its own port instead, and the name in the connection string is
# whatever resolves to this host. Compose publishes it on a *different* port from the one
# compose.infra.yml already binds, because two publishers of one port on one address is a
# container that will not start.
stream {
	server {
		listen     5432;
		proxy_pass postgres:5432;

		# A psql session or a migration can sit idle far longer than a request does.
		proxy_timeout         1h;
		proxy_connect_timeout 5s;
	}
}
