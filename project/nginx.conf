# The reverse proxy's entire configuration — main context and HTTP vhosts in one file
# (paired with ./Dockerfile).
#
# It replaces the stock `nginx.conf` rather than adding a file to `conf.d`, because it has
# to set `resolver` and the shared proxy headers in the `http {}` context that the stock
# file owns.
#
# **Postgres is deliberately not here.** The database is not routed through the proxy at
# all: it is reached on its own published port, on loopback, which is what the server
# running from source and `bun run db:migrate` connect to. It could not have been routed by
# hostname anyway — the Postgres wire protocol carries nothing like a Host header, and a
# client negotiates TLS only after a plaintext `SSLRequest`, so there is no ClientHello for
# nginx's `ssl_preread` to route on.
#
# It is rendered at container start by the nginx image's envsubst entrypoint, with
# NGINX_ENVSUBST_OUTPUT_DIR pointing at /etc/nginx — which is why the hostnames survive into
# here as ${PROXY_*} placeholders. NGINX_ENVSUBST_FILTER limits substitution to those names,
# so nginx's own $host, $http_upgrade and $proxy_add_x_forwarded_for are left alone; without
# that filter envsubst would replace them with nothing.
#
# Each hostname arrives whole. This file does not know that the API is "api." prefixed onto
# a base host — compose assembles the names out of PROXY_HOST, the way it assembles
# DATABASE_URL out of its parts — so moving one of them to an unrelated domain needs no
# change here.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" '
	                  '"$http_user_agent" "$http_x_forwarded_for" host=$host';

	access_log  /var/log/nginx/access.log  main;

	sendfile           on;
	keepalive_timeout  65;

	# Uploads are photographs of prints, straight off a phone. The default 1m rejects them
	# with a 413 that reads like a bug rather than a limit.
	client_max_body_size 64m;

	# Docker's embedded DNS. Naming a resolver is what lets the upstreams below be
	# written as variables, and *that* is what defers their lookup to request time.
	#
	# It matters because this proxy lives in the infrastructure stack while `app` and
	# `client` are in the application one: with a literal `proxy_pass http://app:3000`
	# nginx resolves every upstream at start-up and refuses to run when one is missing, so
	# `dev:infra` alone would not start the proxy at all. Written this way, the routes to
	# absent services answer 502 and everything else works — which is also what keeps the
	# proxy up while the API container restarts.
	resolver 127.0.0.11 valid=10s ipv6=off;

	# Passes a websocket upgrade through when there is one, and closes cleanly when there
	# is not. pgAdmin's query tool and dashboards need it.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Set once here and inherited by every location below, which is the only reason this
	# merge works: nginx replaces *all* inherited directives of a given name as soon as a
	# lower level sets one, so a location adding its own `proxy_set_header` would silently
	# drop every header set above it. Nothing below sets one.
	proxy_http_version 1.1;
	# $http_host, not $host: the difference is the port, and S3 request signatures cover
	# the Host header exactly as the client sent it. Forwarding a port-less Host to Garage
	# makes every signed request fail verification with a 403 that looks like bad credentials.
	proxy_set_header   Host              $http_host;
	proxy_set_header   X-Real-IP         $remote_addr;
	proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header   X-Forwarded-Proto $scheme;
	proxy_set_header   X-Forwarded-Host  $http_host;
	proxy_set_header   Upgrade           $http_upgrade;
	proxy_set_header   Connection        $connection_upgrade;

	# Anything arriving under a name we do not serve. This has to stay first: without a
	# default server the first block below becomes one, and a stray Host header would
	# silently reach the client app.
	server {
		listen      80 default_server;
		server_name _;
		return      404;
	}

	# The archive itself, on the bare host.
	server {
		listen      80;
		server_name ${PROXY_CLIENT_HOST};

		location / {
			set        $upstream_client client:80;
			proxy_pass http://$upstream_client;
		}
	}

	# The API.
	server {
		listen      80;
		server_name ${PROXY_API_HOST};

		location / {
			set        $upstream_api app:3000;
			proxy_pass http://$upstream_api;
		}
	}

	# The S3 API, and the object store's admin UI under a prefix on the same name.
	#
	# **Why the prefix is `_admin` and not `admin`.** Under path-style addressing — which is
	# what the application uses, and what Garage does unless a root_domain turns on
	# virtual-host style — a request is `storage.<host>/<bucket>/<key>`. So any prefix that
	# could be a bucket name is a collision waiting to happen, and `admin` is a perfectly
	# legal bucket name. An underscore is *not* legal in one: Garage rejects `_admin` with
	# "Invalid bucket name". That makes this prefix collision-proof by construction rather
	# than by everyone remembering not to create one bucket.
	#
	# The UI is told the same prefix through BASE_PATH so it builds its own links with it.
	server {
		listen      80;
		server_name ${PROXY_STORAGE_HOST};

		# Originals go to storage untouched (PLAN.md §4.5), and a scan of a print is large.
		# nginx's default 1m would reject them with a 413 that reads like a bug.
		client_max_body_size 512m;
		# Stream the body through rather than spooling it to disk first.
		proxy_request_buffering off;

		# Longest matching prefix wins, so this is chosen over `/` without ordering tricks.
		location /_admin {
			set        $upstream_storage_admin garage-webui:3909;
			proxy_pass http://$upstream_storage_admin;
		}

		location / {
			set        $upstream_storage garage:3900;
			proxy_pass http://$upstream_storage;
		}
	}

	# pgAdmin, on db.<host> — the database's face on the web, since the database itself is
	# not proxied.
	#
	# It builds absolute URLs for its redirects, so it needs the forwarded headers above
	# *and* the matching PGADMIN_CONFIG_PROXY_X_* counts in compose.dev.yml — with only
	# one of the two it redirects to the container's own name and the login loops.
	server {
		listen      80;
		server_name ${PROXY_DB_HOST};

		# Long-lived websockets, and only here: a global read timeout this generous would
		# let any hung upstream tie up a worker for an hour.
		proxy_read_timeout 3600s;

		location / {
			set        $upstream_pgadmin pgadmin:80;
			proxy_pass http://$upstream_pgadmin;
		}
	}
}
