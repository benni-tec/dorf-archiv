# Backing services for development — PLAN.md §4.1 shape 1. Brought up by `bun run dev:infra`.
#
# The client and server run **from source on the host**, so this file's whole job is to put
# the things they talk to on localhost. That is the one real difference from `compose.yml`,
# and it is why the two are written out separately rather than one including the other: an
# including file can add a published port but cannot take one away.
#
# So: **every backing service is published here, and none of them are in `compose.yml`.**
# Development needs `localhost:5432` for the server and for `bun run db:migrate`, which the
# plan has running from the host and never from inside a container. A deployment needs the
# opposite — the proxy is its only way in.
#
# The application, the client and the proxy are deliberately absent. In development they are
# not containers: the client is on :5173 and the server on :3000, from source, with hot
# reload. There is nothing for a proxy to sit in front of.
#
# Volumes are named and shared with `compose.yml` — the project name is the same, so the two
# stacks see the same database. Teardown is `down`, never `down -v`.

name: dorf-archiv

services:
  postgres:
    build:
      context: postgres
    image: dorf-archiv/postgres:18-hunspell
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dorf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorf}
      POSTGRES_DB: ${POSTGRES_DB:-dorf_archiv}
    ports:
      # Loopback by default: published so the host can reach it, not so the network can.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/<major>/docker, so the volume belongs
      # one level up. Mounting .../data here would leave the database in the container's
      # writable layer and lose it on recreate.
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # S3-compatible object storage. The application depends on the S3 API, not on a provider,
  # so this is only development's answer to it — a hosted S3 is reached by changing
  # S3_ENDPOINT and nothing else.
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      # Kept out of garage.toml so the committed config carries no secrets; both override
      # the corresponding config keys.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dorf-dev-admin-token}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-3900}:3900"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro

  # One-shot cluster setup: assign the layout, import the key from .env, create the bucket.
  # **Not optional convenience** — a Garage node with no layout assigned stores nothing at
  # all, so without this the stack comes up and every write fails.
  #
  # A built image, because the Garage image is the bare binary with no shell to run a script
  # with. The metadata volume is mounted read-only for the node key, which is what the CLI
  # authenticates its RPC with.
  garage-init:
    build:
      context: garage
    image: dorf-archiv/garage-init:latest
    depends_on:
      garage:
        condition: service_started
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      S3_BUCKET: ${S3_BUCKET:-dorf-archiv}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dorfarchivdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret-key-0123456789}
    volumes:
      - garage-meta:/var/lib/garage/meta:ro
      - ./garage/garage.toml:/etc/garage.toml:ro

  # Garage ships no admin interface of its own, so this is the community one. It drives
  # Garage's admin API, which is what the token is for.
  #
  # No AUTH_USER_PASS here: it is on loopback and nothing is in front of it. `compose.yml`
  # sets one, because there it is published through the proxy.
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_started
    environment:
      API_BASE_URL: http://garage:3903
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:-dorf-dev-admin-token}
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GARAGE_WEBUI_PORT:-3909}:3909"

  # A database console, so inspecting a row does not mean remembering psql flags. Reached
  # directly at http://localhost:5050 here — there is no proxy in development to put it
  # behind, which is also why the PGADMIN_CONFIG_PROXY_X_* counts that `compose.yml` sets are
  # absent: trusting a forwarded header when nothing in front is setting it lets a client
  # spoof it.
  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dorf-archiv.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dorf-dev-secret}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # `.test` is the TLD reserved for exactly this, so the default login can never be a
      # real address — but pgAdmin rejects reserved TLDs until they are allowed explicitly.
      # The value is a Python list literal, which is what pgAdmin parses this into.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test', 'local', 'localhost', 'invalid']"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./postgres/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  pgadmin-data:
