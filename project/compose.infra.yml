# Backing services for development (PLAN.md §4.1, shape 1).
#
# Standalone and self-sufficient: this is what `bun run dev:infra` brings up, with the client
# and server running from source on the host and pointed at localhost. `compose.yml` pulls
# this file in with `include:` rather than restating it, so the two cannot drift.
#
# Volumes are named and survive teardown — `down`, never `down -v`.

name: dorf-archiv

services:
  postgres:
    build:
      context: postgres
    image: dorf-archiv/postgres:18-hunspell
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dorf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorf}
      POSTGRES_DB: ${POSTGRES_DB:-dorf_archiv}
    ports:
      # Bound to loopback by default. `compose.yml` reuses this file verbatim for the
      # whole-stack deployment, where the app reaches Postgres over the Compose network by
      # service name — publishing the database to every interface there would be an
      # accident, not a feature. Set BIND_ADDRESS to 0.0.0.0 if you really want it exposed.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/<major>/docker, so the volume
      # belongs one level up. Mounting .../data here would leave the database in the
      # container's writable layer and lose it on recreate.
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dorf}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # A database console, so inspecting a row does not mean remembering psql flags. Reachable
  # at http://localhost:5050 with the credentials from .env.
  #
  # It is in *this* file rather than a separate one because `compose.yml` includes this file
  # wholesale, which means pgAdmin comes up with the full stack too. The loopback binding
  # below is what keeps that from being a mistake — a database console published on every
  # interface is a far better target than the database itself.
  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dorf-archiv.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dorf-dev-secret}
      # Nothing here is reachable from outside the box, and a master password on top of the
      # login is one more thing to lose in a development tool.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # `.test` is the TLD reserved for exactly this, so the default login can never be a
      # real address — but pgAdmin rejects reserved TLDs until they are allowed explicitly.
      # The value is a Python list literal, which is what pgAdmin parses this into.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test', 'local', 'localhost', 'invalid']"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      # Behind the reverse proxy, pgAdmin must build its redirects from the forwarded
      # headers rather than from the container's own name, or the login loops. Each count is
      # the number of proxies adding that header — one.
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./postgres/servers.json:/pgadmin4/servers.json:ro

  # One-shot bucket creation. Without it, first-run development means clicking through the
  # MinIO console. It retries rather than depending on a healthcheck, because the MinIO
  # image carries no reliable in-container probe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_BUCKET: ${S3_BUCKET:-dorf-archiv}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dorf}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
            break
          fi
          echo "waiting for minio ($$attempt/30)"
          sleep 2
        done
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # PLAN.md §4.6 #3: unpublished blobs sit in storage from the moment of upload, so a
        # public bucket policy would bypass moderation entirely. Files reach browsers only
        # through short-lived presigned URLs the backend issues after a permission check.
        mc anonymous set none "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready (private)"

  # One entry point in front of the stack, routing by hostname (PLAN.md §4.1 shape 2).
  #
  #   http://${PROXY_HOST}:${PROXY_PORT}            the client
  #   http://api.${PROXY_HOST}:${PROXY_PORT}        the API
  #   http://admin.db.${PROXY_HOST}:${PROXY_PORT}   pgAdmin
  #   ${PROXY_HOST}:${PROXY_DB_PORT}                Postgres, over TCP
  #
  # Each of those names can be overridden on its own with PROXY_CLIENT_HOST,
  # PROXY_API_HOST or PROXY_ADMIN_HOST.
  #
  # The database is on its own port rather than a hostname because the Postgres wire
  # protocol has nothing to route on — see proxy/stream.conf.
  proxy:
    build:
      # This directory, not the repository root: the proxy needs only its Dockerfile and
      # nginx.conf, and project/.dockerignore keeps the rest of the workspace out.
      context: .
      dockerfile: Dockerfile
    image: dorf-archiv/proxy:latest
    restart: unless-stopped
    depends_on:
      # Only what lives in this file. The application services are in compose.app.yml and
      # may not exist at all; their routes answer 502 until they do.
      postgres:
        condition: service_healthy
    environment:
      # Each name is assembled here, from PROXY_HOST, the same way DATABASE_URL is assembled
      # from its parts — the proxy receives finished hostnames rather than a base name and
      # the rules for building the others. That keeps the composition in one readable place,
      # and it means a deployment can put any one of them on an unrelated domain by setting
      # its own variable, without the others following it.
      PROXY_CLIENT_HOST: ${PROXY_CLIENT_HOST:-${PROXY_HOST:-localhost}}
      PROXY_API_HOST: ${PROXY_API_HOST:-api.${PROXY_HOST:-localhost}}
      PROXY_ADMIN_HOST: ${PROXY_ADMIN_HOST:-admin.db.${PROXY_HOST:-localhost}}
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_PORT:-8000}:80"
      # Not 5432: compose.infra.yml already binds that, and two publishers of one port on
      # one address is a container that will not start.
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_DB_PORT:-5433}:5432"

volumes:
  postgres-data:
  minio-data:
  pgadmin-data:
