# Backing services for development (PLAN.md §4.1, shape 1).
#
# Standalone and self-sufficient: this is what `bun run dev:infra` brings up, with the client
# and server running from source on the host and pointed at localhost. `compose.yml` pulls
# this file in with `include:` rather than restating it, so the two cannot drift.
#
# Volumes are named and survive teardown — `down`, never `down -v`.

name: dorf-archiv

services:
  postgres:
    build:
      context: postgres
    image: dorf-archiv/postgres:18-hunspell
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dorf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorf}
      POSTGRES_DB: ${POSTGRES_DB:-dorf_archiv}
    ports:
      # Bound to loopback by default. `compose.yml` reuses this file verbatim for the
      # whole-stack deployment, where the app reaches Postgres over the Compose network by
      # service name — publishing the database to every interface there would be an
      # accident, not a feature. Set BIND_ADDRESS to 0.0.0.0 if you really want it exposed.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/<major>/docker, so the volume
      # belongs one level up. Mounting .../data here would leave the database in the
      # container's writable layer and lose it on recreate.
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dorf}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # One-shot bucket creation. Without it, first-run development means clicking through the
  # MinIO console. It retries rather than depending on a healthcheck, because the MinIO
  # image carries no reliable in-container probe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_BUCKET: ${S3_BUCKET:-dorf-archiv}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dorf}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dorf-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
            break
          fi
          echo "waiting for minio ($$attempt/30)"
          sleep 2
        done
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # PLAN.md §4.6 #3: unpublished blobs sit in storage from the moment of upload, so a
        # public bucket policy would bypass moderation entirely. Files reach browsers only
        # through short-lived presigned URLs the backend issues after a permission check.
        mc anonymous set none "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready (private)"

volumes:
  postgres-data:
  minio-data:
